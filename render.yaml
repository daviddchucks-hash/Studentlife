services:
  - type: web
    name: afitstudentlife-api
    runtime: node
    plan: free
    buildCommand: npm ci --registry=https://registry.npmjs.org
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://daviddchucks-hash.github.io
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

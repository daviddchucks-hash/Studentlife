<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>My Saved Items — AFITStudentLife</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body class="dashboard-page">
  <header class="app-header"></header>
  <main class="page-container">
    <section class="page-header">
      <p class="eyebrow">Personal Storage</p>
      <h1>My Saved Items</h1>
      <p>Access all your saved timetables, courses, assignments, deadlines, notes, flashcards, quizzes, and bookmarked formulas in one place.</p>
    </section>

    <div class="dashboard-section" style="margin-bottom:20px;">
      <div class="search-bar-wrap" style="max-width:100%; margin-bottom:14px;">
        <input type="search" id="saved-search-input" placeholder="Search across all saved items, notes, courses, formulas...">
      </div>

      <nav class="tool-filters" id="saved-category-filters">
        <button class="filter-button" aria-pressed="true" data-cat="all">All Items</button>
        <button class="filter-button" aria-pressed="false" data-cat="timetable">Timetable</button>
        <button class="filter-button" aria-pressed="false" data-cat="courses">Courses</button>
        <button class="filter-button" aria-pressed="false" data-cat="assignments">Assignments</button>
        <button class="filter-button" aria-pressed="false" data-cat="deadlines">Deadlines</button>
        <button class="filter-button" aria-pressed="false" data-cat="exams">Exams</button>
        <button class="filter-button" aria-pressed="false" data-cat="notes">Notes</button>
        <button class="filter-button" aria-pressed="false" data-cat="flashcards">Flashcards</button>
        <button class="filter-button" aria-pressed="false" data-cat="quizzes">Quizzes</button>
        <button class="filter-button" aria-pressed="false" data-cat="formula-bookmarks">Bookmarked Formulas</button>
      </nav>
    </div>

    <div id="saved-items-container" class="record-list"></div>
  </main>

  <footer class="site-footer app-footer">
    <a href="./index.html">AFITStudentLife</a>
    <span>Tools for your academic routine.</span>
  </footer>

  <script type="module" src="./js/page-saved.js"></script>
</body>
</html>

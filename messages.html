<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Messages — AFITStudentLife</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body class="dashboard-page">
  <header class="app-header"></header>

  <main class="page-container">
    <section class="page-header">
      <p class="eyebrow">Student Messaging</p>
      <h1>Messages</h1>
      <p>Search for a verified student using a matric number and start a secure text-only conversation.</p>
    </section>

    <div class="dashboard-section" style="padding:20px;">
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px;">
        <form id="student-search-form" class="tool-form" style="flex:1 1 360px; min-width:260px; margin:0;">
          <div class="form-row" style="margin:0; align-items:end;">
            <label class="field" style="flex:1 1 240px; margin:0;">
              <span>Search by matric number</span>
              <input id="matric-input" name="matric" type="text" placeholder="AFIT/23/1234" autocomplete="off" required>
            </label>
            <button class="button button-primary" type="submit">Search student</button>
          </div>
        </form>
      </div>

      <div id="search-state" aria-live="polite"></div>

      <div class="chat-shell" style="display:grid; grid-template-columns:320px 1fr; gap:18px; min-height:620px;">
        <aside class="chat-sidebar" style="border:1px solid var(--line); border-radius:18px; background:var(--card); padding:12px; display:flex; flex-direction:column; min-height:420px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <h2 style="margin:0; font-size:1rem;">Conversations</h2>
            <span id="conversation-count" class="muted">0</span>
          </div>
          <div id="conversation-list" class="record-list"></div>
        </aside>

        <section class="chat-panel" style="border:1px solid var(--line); border-radius:18px; background:var(--card); display:flex; flex-direction:column; min-height:420px;">
          <div id="chat-header" style="padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; min-height:72px;">
            <div class="muted">Select a conversation to begin.</div>
          </div>
          <div id="chat-messages" style="flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; background:rgba(9, 19, 40, 0.02);"></div>
          <form id="chat-form" style="padding:16px 18px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-end;">
            <label class="field" style="flex:1; margin:0;">
              <span class="sr-only">Type a message</span>
              <textarea id="message-input" rows="1" maxlength="2000" placeholder="Type a text message..." style="resize:vertical; min-height:48px; max-height:180px;"></textarea>
            </label>
            <button class="button button-primary" type="submit" id="send-button">Send</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer app-footer">
    <a href="./index.html">AFITStudentLife</a>
    <span>Tools for your academic routine.</span>
  </footer>

  <script type="module" src="./js/page-messages.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Courses & Registration — AFITStudentLife</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body class="dashboard-page">
  <header class="app-header"></header>
  <main class="page-container">
    <section class="page-header">
      <p class="eyebrow">Academic Course Manager</p>
      <h1>Registered Courses & Semester Planner</h1>
      <p>Manage your registered courses, draft semester course selections, and calculate total credit units.</p>
    </section>

    <div class="dashboard-section" style="margin-bottom:20px;">
      <h2 style="font-size:18px; margin-bottom:12px;">Add Course</h2>
      <form id="course-form" class="tool-form">
        <div class="form-row">
          <label class="field">Course Code<input name="code" required placeholder="e.g. CSC 201"></label>
          <label class="field">Course Title<input name="name" required placeholder="e.g. Object-Oriented Programming"></label>
        </div>
        <div class="form-row">
          <label class="field">Credit Units<input type="number" step="0.5" min="0.5" max="60" name="units" required placeholder="e.g. 3"></label>
          <label class="field">Category
            <select name="type">
              <option value="personal">Personal Course List</option>
              <option value="registration">Semester Registration Draft</option>
            </select>
          </label>
        </div>
        <div id="course-form-msg"></div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="button button-primary">Save Course</button>
          <button type="reset" class="button button-quiet">Reset</button>
        </div>
      </form>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2>Saved Courses</h2>
      <div id="total-units-badge" class="pill-badge active" style="font-size:14px; padding:6px 14px;">Total Credit Units: 0</div>
    </div>
    <div id="courses-list-container"></div>
  </main>

  <footer class="site-footer app-footer">
    <a href="./index.html">AFITStudentLife</a>
    <span>Tools for your academic routine.</span>
  </footer>

  <script type="module" src="./js/page-courses.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Sign in — AFITStudentLife</title>
  <link rel="stylesheet" href="./css/global.css">
</head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="./index.html"><span class="brand-mark">A</span><span>AFIT<span class="brand-light">StudentLife</span></span></a><a class="text-link" href="./index.html">Back to home</a></header>
  <main class="auth-layout">
    <section class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to your account</h1>
      <p class="muted">Pick up where you left off with your courses and plans.</p>
      <form id="auth-form" class="form-stack" novalidate>
        <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password"></label>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        <button class="button button-primary button-full" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">New to AFITStudentLife? <a href="./signup.html">Create an account</a></p>
    </section>
  </main>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
